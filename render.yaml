services:
  - type: web
    name: label-generator
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      - key: MONGO_URI
        sync: false
      - key: PUBLIC_API_ORIGIN
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
